version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule: 
      interval: "weekly"
    groups:
      major-updates:
        patterns:
          - "*"
        update-types:
          - "major"
      minor-patch-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "monthly"