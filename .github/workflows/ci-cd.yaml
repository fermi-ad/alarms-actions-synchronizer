name: CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:
  run-tests-and-coverage:
    uses: fermi-ad/.github/.github/workflows/rust-integration.yaml@bbb0d5297b687cee04820ed0b2fea5b4c8d4b4b9
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
    with:
      coverage-exclude: '|.*/tests.rs$'
      references-internal-git-repo: true

  deploy:
    needs: run-tests-and-coverage
    if: ${{ github.event_name == 'push' }}
    uses: fermi-ad/.github/.github/workflows/rust-deployment.yaml@bbb0d5297b687cee04820ed0b2fea5b4c8d4b4b9
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
    with:
      references-internal-git-repo: true
