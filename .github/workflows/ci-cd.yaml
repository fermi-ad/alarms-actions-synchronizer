name: CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests-and-coverage:
    uses: fermi-ad/.github/.github/workflows/rust-integration.yaml@f5b1570438803675367730e055d4a3e1983be9d1
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
    with:
      pull-git-submodules: true
      references-internal-git-repo: true
      static-dependencies: 'libcurl4-openssl-dev libsasl2-dev'

  deploy:
    needs: run-tests-and-coverage
    if: ${{ github.event_name == 'push' }}
    uses: fermi-ad/.github/.github/workflows/rust-deployment.yaml@6e196e87b3b79167b57bf18cf3ca0cfcd88f958f
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
    with:
      pull-git-submodules: true
      references-internal-git-repo: true
      static-dependencies: 'libcurl4-openssl-dev libsasl2-dev'
